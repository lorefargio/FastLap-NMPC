mpc_controller:
  ros__parameters:
    use_sim_time: true
    control_rate: 100.0          # Control loop execution frequency [Hz]
    mpc_dt: 0.05                 # Prediction horizon time step [s] (N=30 -> 1.5s preview)
    max_torque_per_wheel: 100.0  # Max motor torque [Nm]
    outer_steering_ratio: 0.23   # PACSim steering ratio
    max_lateral_error: 1.0       # Emergency stop safety limit [m]
    emergency_stop: false
    log_dir: "/workspace/MPC_logs"

    # Track Geometry & Constraints
    default_track_width: 3.0     # Nominal track width [m]
    track_margin: 0.45           # Safety buffer from cones [m] (half-car 0.7m + 0.15m)
    effective_mu: 1.0            # Effective tire friction coefficient

    # Acceleration & Speed Bounds
    max_accel: 3.5               # Max longitudinal acceleration [m/s^2]
    min_accel: -8.0              # Max braking deceleration [m/s^2]
    stop_on_trajectory_complete: false
